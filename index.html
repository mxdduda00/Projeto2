<!DOCTYPE html>

<html>
    <head>
        <tittle>Projeto 2</tittle>
    </head>
    <body>
        <main>
            <h1>Portifólio de Snezhnaya</h1>
            <p>Personagens lançados até o momento na região de Snezhnaya em Genshin Impact</p>
            <section>
                <h3>Galeria de fotos</h3>
                <section>
                    <figure>
                        <img src="img\alyosha.jpg" width="400">

                        <figcaption>Alyosha é um personagem de 4 estrelas do elemento Electro e usuário 
                        de Lança. Ele atua como um suporte focado em dano fora de campo, aplicação Electro, 
                        cura e bônus para reações e ATQ.</figcaption>
                    </figure>
                    <figure>
                        <img src="img\danica.jpg" width="400">

                        <figcaption>Danica é uma personagem do elemento Electro que teve sua primeira 
                        aparição no trailer <i>Transcendence - "Neve Repentina"</i>, não tendo sido 
                        lançada de forma jogável ainda.</figcaption>
                    </figure>
                    <figure>
                        <img src="img\mitya.jpg" width="400">

                        <figcaption>Mitya é um personagem de raridade 5 estrelas em Genshin Impact, 
                        focado em atuar principalmente como DPS em campo com a mecânica de Condutividade 
                        Estelar</figcaption>
                    </figure>
                    <figure>
                        <img src="img\noy.jpg" width="400">

                        <figcaption>Noy é um personagem sem elemento revelado que teve sua primeira 
                        aparição no trailer <i>Transcendence - "Neve Repentina"</i>, não tendo sido 
                        lançada de forma jogável ainda.</figcaption>
                    </figure>
                    <figure>
                        <img src="img\odette.jpg" width="400">

                        <figcaption>Odette é uma personagem de 5 estrelas do elemento Cryo que usa espada 
                        e atua como Sub-DPS e suporte focada em reações estelares.</figcaption>
                    </figure>
                    <figure>
                        <img src="img\tsaritsa.jpg" width="400">

                        <figcaption>Tsaritsa é a Arconte de Snezhnaya do elemento Cryo que está prevista
                        pra ser lançada de forma jogável no jogo a partir da versão 7.3.</figcaption>
                    </figure>
                    <figure>
                        <img src="img\valeriy.jpg" width="400">

                        <figcaption>Valeriy é um personagem do elemento Electro que teve sua primeira 
                        aparição no trailer <i>Transcendence - "Neve Repentina"</i>, não tendo sido 
                        lançada de forma jogável ainda.</figcaption>
                    </figure>
                    <figure>
                        <img src="img\vesna.jpg" width="400">

                        <figcaption>Vesna é uma personagem de raridade 5 estrelas, usuária de Espada e do 
                        elemento Anemo, focada em atuar como DPS principal em campo com forte aproveitamento 
                        da reação de Redemoinho Estelar.</figcaption>
                    </figure>
                    <figure>
                        <img src="img\vodyanitsa.jpg" width="400">

                        <figcaption>A Vodyanitsa é uma personagem do elemento Hydro focada em suporte e 
                        cura que escala com sua Vida Máxima para causar dano Hydro fora de área de forma
                        periódica</figcaption>
                    </figure>
                </section>
            </section>
        </main>
    </body>
</html>
